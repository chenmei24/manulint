<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
<title id="title">manulint — a local manuscript rule checklist</title>
<desc id="desc">Conceptual checklist of structure, ethics wording, and references. Local rules support human review. A rule score does not predict acceptance.</desc>
